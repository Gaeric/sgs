<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <title>文档</title>
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css"
    />
  </head>
  <body>
    <div id="app"></div>

    <script>
      window.$docsify = {
        loadSidebar: true, // 加载自定义侧边栏
        subMaxLevel: 3, // 设置生成目录的最大层级
        homepage: "pages/diy.md", //入口文件

        search: "auto", // 默认值

        search: {
          maxAge: 86400000, // 过期时间，单位毫秒，默认一天
          paths: "auto", // or 'auto'，匹配文件路径
          placeholder: "Type to search", // 搜索提示框文字， 支持本地化，例子在下面

          noData: "No Results!", // 找不到结果文字提示，支持本地化，例子在下面

          depth: 3, // 搜索标题的最大程级, 1 - 6
          hideOtherSidebarContent: true, // 是否隐藏其他侧边栏内容
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <!-- 引入搜索模块 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  </body>
</html>
